[package]
name = "pc-core"
version.workspace = true
edition.workspace = true
description = "Launcher engine for Shadow Client (no UI)."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json", "stream", "gzip", "http2", "multipart"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
regex = "1"
url = "2"
toml = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
dirs = "7"
trash = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
] }

[dev-dependencies]
tempfile = "3"
mockito = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "net"] }
