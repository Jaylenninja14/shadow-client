<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23262d"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e6eaf0"/>
      <stop offset="1" stop-color="#aeb6c3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.47" r="0.5">
      <stop offset="0" stop-color="#2f6fed" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2f6fed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb0ff"/>
      <stop offset="1" stop-color="#2f6fed"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#bg)"/>
  <circle cx="512" cy="480" r="400" fill="url(#glow)"/>
  <!-- a blocky ghost: square-ish head, stepped hem like Minecraft blocks -->
  <path d="M272 830 V440 Q272 232 512 232 Q752 232 752 440 V830 H672 V770 H592 V830 H432 V770 H352 V830 Z" fill="url(#body)"/>
  <!-- soft shading down one side -->
  <path d="M672 300 Q752 360 752 440 V770 H672 Z" fill="#9aa3b1" fill-opacity="0.28"/>
  <!-- glowing blue eyes -->
  <rect x="372" y="420" width="92" height="128" rx="22" fill="url(#eye)"/>
  <rect x="560" y="420" width="92" height="128" rx="22" fill="url(#eye)"/>
  <rect x="388" y="436" width="28" height="36" rx="8" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="576" y="436" width="28" height="36" rx="8" fill="#ffffff" fill-opacity="0.85"/>
</svg>
