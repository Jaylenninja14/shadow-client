<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211838"/>
      <stop offset="1" stop-color="#08070e"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c8ff"/>
      <stop offset="0.45" stop-color="#9b7bff"/>
      <stop offset="1" stop-color="#5b2bd9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9b7bff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#9b7bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="420" fill="url(#glow)"/>
  <!-- glowing block, eclipsed by its own shadow -->
  <rect x="262" y="262" width="460" height="460" rx="40" fill="url(#core)"/>
  <rect x="352" y="232" width="440" height="440" rx="40" fill="#0b0914" stroke="#08070e" stroke-width="12"/>
  <!-- blocky rim light where the shadow meets the block -->
  <rect x="262" y="682" width="120" height="40" rx="10" fill="#efe6ff" fill-opacity="0.85"/>
  <rect x="262" y="582" width="40" height="100" rx="10" fill="#efe6ff" fill-opacity="0.55"/>
  <!-- the shadow's eyes -->
  <rect x="482" y="402" width="70" height="70" rx="8" fill="#9b7bff"/>
  <rect x="622" y="402" width="70" height="70" rx="8" fill="#9b7bff"/>
</svg>
